<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shirokujaku</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
</style>
</head>
<body>
<canvas id="c" aria-label="A dithered night sea with a lighthouse; the moon follows the cursor"></canvas>
<script>
const FS = `
precision highp float;
uniform vec2 R;     // canvas size in device pixels
uniform float T;    // seconds
uniform vec2 M;     // moon position, 0..1 with y up
uniform float DOT;  // device pixels per dither dot

float hash(vec2 p) { vec3 q = fract(p.xyx * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + 1.0), f.x), f.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; }
  return v;
}
// 8x8 ordered (Bayer) threshold built from three 2x2 levels
float bayer2(vec2 a) { a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }
float bayer8(vec2 a) { return bayer2(0.25 * a) * 0.0625 + bayer2(0.5 * a) * 0.25 + bayer2(a); }

void main() {
  vec2 px = floor(gl_FragCoord.xy / DOT);
  vec2 uv = px * DOT / R;
  float aspect = R.x / R.y, hz = 0.46, g;
  vec2 moon = vec2(M.x, max(M.y, hz + 0.12));

  // headland and lighthouse on the left
  float land = hz + 0.1 * smoothstep(0.34, 0.04, uv.x) + 0.025 * fbm(vec2(uv.x * 14.0, 3.0)) - 0.012;
  vec2 lamp = vec2(0.14, hz + 0.1 * smoothstep(0.34, 0.04, 0.14) + 0.012 + 0.13);
  float towerY = (uv.y - lamp.y + 0.13) / 0.13; // 0 at base, 1 at lamp
  bool tower = towerY > -0.2 && towerY < 1.0 && abs(uv.x - lamp.x) * aspect < mix(0.011, 0.006, towerY);
  bool solid = (uv.x < 0.36 && uv.y < land && uv.y > hz - 0.012) || tower;

  if (uv.y > hz) {
    vec2 d = (uv - moon) * vec2(aspect, 1.0);
    float r = length(d);
    float disc = smoothstep(0.036, 0.032, r) * (0.75 + 0.3 * fbm(d * 40.0 + 4.0));
    float glow = 0.5 * exp(-r * 7.0);
    float sky = 0.03 + 0.24 * pow(1.0 - (uv.y - hz) / (1.0 - hz), 3.0); // horizon haze backlights the land
    vec2 cp = vec2(uv.x * aspect * 2.2 + T * 0.02, uv.y * 8.0);
    float cd = fbm(cp + 0.9 * fbm(cp * 1.7 - T * 0.02)); // warped, drifting cloud field
    float cl = smoothstep(0.5, 0.62, cd);
    float rim = smoothstep(0.47, 0.53, cd) * (1.0 - smoothstep(0.55, 0.66, cd));
    float rays = d.y < 0.0 ? pow(noise(vec2(atan(d.x, -d.y) * 9.0, T * 0.08)), 3.0) * exp(-r * 2.5) * 0.22 : 0.0;
    float stars = step(0.9965, hash(px)) * (1.0 - cl) * smoothstep(0.15, 0.5, r);
    g = sky + glow + stars + rays * (1.0 - cl);
    g = mix(g, 0.015 + glow * (0.12 + 2.6 * rim), cl); // dark clouds with moonlit rims
    g = max(g, disc * (1.0 - cl * 0.85));
  } else {
    float dy = hz - uv.y;
    float z = 0.25 / (dy + 0.003);
    vec2 w = vec2((uv.x - 0.5) * aspect * z, z);
    float h = fbm(w * vec2(1.5, 6.0) + vec2(T * 0.05, -T * 0.3)) * 0.6
            + fbm(w * vec2(5.0, 20.0) + vec2(-T * 0.04, -T * 0.6)) * 0.4;
    float path = exp(-pow((uv.x - moon.x) * aspect / (0.02 + 0.35 * dy), 2.0));
    g = 0.02 + 0.07 * h + path * smoothstep(0.5, 0.74, h) * 1.15 + path * 0.05 + 0.12 * exp(-dy * 60.0);
  }

  // sweeping lighthouse beam; the lamp flares when it faces us
  float th = T * 0.7, cs = cos(th);
  vec2 v = (uv - lamp) * vec2(aspect, 1.0);
  float along = v.x * sign(cs), perp = abs(v.y);
  float beam = along > 0.0 ? exp(-perp / (0.003 + along * 0.06)) * (1.0 - smoothstep(0.0, abs(cs) * 1.4 + 0.01, along)) * 0.7 : 0.0;
  float flare = exp(-length(v) * 60.0) * (0.5 + 1.5 * pow(abs(sin(th)), 12.0));
  if (solid) g = 0.0;
  g += beam + flare;

  // ragged edges that dissolve into the page
  vec2 e = min(uv, 1.0 - uv);
  g *= smoothstep(0.0, 0.05 + hash(px * 0.5) * 0.08, min(e.x, e.y));

  // bright areas shimmer: jitter the threshold over time
  float jitter = (noise(px * 0.15 + T * 1.3) - 0.5) * 0.15 + 0.07 * sin(T * 2.0 + hash(px * 0.2) * 6.28);
  float ink = step(clamp(bayer8(px) + 0.1 + jitter * smoothstep(0.05, 0.3, g), 0.001, 0.999), g);
  gl_FragColor = vec4(mix(vec3(0.067), vec3(0.91, 0.835, 0.718), ink), 1.0);
}`;

const c = document.getElementById('c');
const gl = c.getContext('webgl');
const prog = gl.createProgram();
for (const [type, src] of [[gl.VERTEX_SHADER, 'attribute vec2 p; void main() { gl_Position = vec4(p, 0, 1); }'], [gl.FRAGMENT_SHADER, FS]]) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  gl.attachShader(prog, s);
}
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);

const moon = { x: 0.62, y: 0.78 }, target = { ...moon };
addEventListener('pointermove', e => { target.x = e.clientX / innerWidth; target.y = 1 - e.clientY / innerHeight; });

function resize() {
  const dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  gl.viewport(0, 0, c.width, c.height);
  gl.uniform2f(U('R'), c.width, c.height);
  gl.uniform1f(U('DOT'), dpr); // one dither dot per css pixel
}
addEventListener('resize', resize);
resize();

(function loop(t) {
  moon.x += (target.x - moon.x) * 0.05;
  moon.y += (target.y - moon.y) * 0.05;
  gl.uniform1f(U('T'), t / 1000);
  gl.uniform2f(U('M'), moon.x, moon.y);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(loop);
})(0);
</script>
</body>
</html>
